type: action
definition:
  title: Get Observable Case
  description: Retrieve observables of the case
  display_group: TheHive
  namespace: integrations.thehive
  name: get_observable_case
  secrets:
    - name: thehive4
      keys: ["apikey", "url"]
  expects:
    case_id:
      type: str
      description: Case ID
  steps:
    - ref: thehive_query
      action: core.http_request
      args:
        url: ${{ SECRETS.thehive4.url }}/api/v1/query
        method: POST
        headers:
          Authorization: Bearer ${{ SECRETS.thehive4.apikey }}
          Content-Type: application/json
        payload:
          query:
            - _name: getCase
              idOrName: ${{ inputs.case_id }}
            - _name: observables
            - _name: sort
              _fields:
                - startDate: desc
  returns: ${{ steps.thehive_query.result }}
